<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: the agent drafts the will-not-implement ledger, the gate checks each diff hunk against it, verdicts land in the gates audit log">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="190" y1="180" x2="250" y2="180" marker-end="url(#ah-l)"/>
    <line x1="410" y1="180" x2="470" y2="180" marker-end="url(#ah-l)"/>
    <line x1="630" y1="180" x2="690" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (period 16, from 32 to 0 = 2 cycles, seamless) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="190" y1="180" x2="244" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="180" x2="464" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="630" y1="180" x2="684" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets traveling along each connector -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M190,180 L244,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M410,180 L464,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M630,180 L684,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="30" y="140" width="160" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Agent + skill</text>
    <text x="110" y="193" text-anchor="middle" font-size="11" fill="#6E6E73">drafts the ledger</text>

    <rect x="250" y="140" width="160" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">.negplan.md</text>
    <text x="330" y="193" text-anchor="middle" font-size="11" fill="#6E6E73">will-not-implement</text>

    <rect x="470" y="140" width="160" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="550" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Gate</text>
    <text x="550" y="193" text-anchor="middle" font-size="11" fill="#6E6E73">hunk &#8596; entry</text>

    <rect x="690" y="140" width="160" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="770" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Audit log</text>
    <text x="770" y="193" text-anchor="middle" font-size="11" fill="#6E6E73">allowed / creep</text>
  </g>

  <text x="440" y="266" text-anchor="middle" font-size="12" fill="#6E6E73">portable markdown — no server, no second process</text>
</svg>
